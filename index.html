<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álvaro García M.</title>

<style>
:root{
  --bg:#fff;
  --text:#111;
  --muted:#555;
  --card:rgba(0,0,0,0.04);
  --border:rgba(0,0,0,0.1);
  --blue:#2b6fff;
  --red:#ff3b3b;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --text:#f2f2f2;
    --muted:#b5b5b5;
    --card:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.12);
  }
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(43,111,255,0.18), transparent 40%),
    radial-gradient(circle at bottom right, rgba(255,59,59,0.15), transparent 40%),
    var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
}

.container{
  max-width:720px;
  width:100%;
  padding:60px 20px;

  opacity:0;
  transform:translateY(20px);
  animation:pageIn 0.8s ease-out forwards;
}

@keyframes pageIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.profile{
  text-align:center;
  margin-bottom:25px;
}

.profile img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--blue);
}

h1{
  margin:15px 0 5px;
  font-size:30px;
}

.bio{
  color:var(--muted);
  max-width:520px;
  margin:0 auto;
}

/* SOCIAL */
.social{
  margin-top:18px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.social-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-radius:12px;
  text-decoration:none;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  transition:0.25s ease;
}

.social-item:hover{
  transform:translateY(-3px);
  border-color:var(--red);
}

.social-item img{
  width:18px;
  height:18px;
  object-fit:cover;
}

/* TITULOS */
h2{
  margin-top:35px;
  font-size:18px;
}

h2::after{
  content:"";
  display:block;
  width:40px;
  height:3px;
  margin-top:6px;
  background:linear-gradient(to right,var(--blue),var(--red));
  border-radius:2px;
}

/* GRID */
.grid{
  display:grid;
  gap:12px;
  margin-top:20px;
}

/* CARDS */
.card{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px;
  border-radius:16px;
  text-decoration:none;
  background:var(--card);
  border:1px solid var(--border);
  transition:0.3s ease;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:-40px;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),
    rgba(43,111,255,0.25),
    rgba(255,59,59,0.18),
    transparent 60%);
  opacity:0;
  filter:blur(25px);
  transition:0.3s ease;
}

.card:hover::before{
  opacity:1;
}

.card:hover{
  transform:translateY(-4px) scale(1.01);
  border-color:var(--red);
}

/* ICONOS */
.icon{
  width:48px;
  height:48px;
  border-radius:12px;
  object-fit:cover;
}

/* TEXTO */
.card strong{
  display:block;
  font-size:15px;
}

.card span{
  font-size:13px;
  color:var(--muted);
}

.card div{
  display:flex;
  flex-direction:column;
}

/* MOBILE */
@media(max-width:600px){
  h1{font-size:26px;}
  .container{padding:40px 16px;}
}
</style>
</head>

<body>

<div class="container">

  <!-- PERFIL -->
  <div class="profile">
    <img src="https://i.blogs.es/322f86/blob/288_288.jpeg">
    <h1>Álvaro García M.</h1>
    <p class="bio">Ser humano que hace cosas. Entre ellas, escribir de tecnología.</p>

    <!-- SOCIAL -->
    <div class="social">

      <a class="social-item" href="https://x.com/AlvaroGarciaM_" target="_blank">
        <img src="https://img.magnific.com/vector-premium/nuevo-logotipo-twitter-es-vector-elon-musk_982229-557.jpg" alt="X">
        Sígueme en X
      </a>

      <a class="social-item" href="mailto:alvarogarciam.profesional@gmail.com">
        <img src="https://images.vexels.com/media/users/3/140928/isolated/preview/8d338f5acd60bfbc9b5fb1b208c8814f-icono-redondo-de-correo-electronico-contorneado.png" alt="Email">
        Escríbeme
      </a>

    </div>
  </div>

  <!-- TRABAJOS -->
  <h2>Mis trabajos</h2>

  <div class="grid">

    <a class="card" href="https://www.applesfera.com/autor/alvaro-garcia">
      <img class="icon" src="https://yt3.googleusercontent.com/AchftUgiT2t0fzQtg091oMaLSUv0PHweWArc8qvI5CD5-EyIMFkWrs5V969b9Wf5cr6gPsFtug=s900-c-k-c0x00ffffff-no-rj">
      <div>
        <strong>Applesfera</strong>
        <span>Apple y ecosistema</span>
      </div>
    </a>

    <a class="card" href="https://www.xataka.com/autor/alvaro-garcia">
      <img class="icon" src="https://pbs.twimg.com/profile_images/1992893228341747712/VpqkV78R_400x400.jpg">
      <div>
        <strong>Xataka</strong>
        <span>Tecnología y análisis</span>
      </div>
    </a>

    <a class="card" href="https://www.xatakamovil.com/autor/alvaro-garcia">
      <img class="icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlIQhgviqLt-EXM7LHVnNRc8OjkdJUhA8ceA&s">
      <div>
        <strong>Xataka Móvil</strong>
        <span>Smartphones</span>
      </div>
    </a>

    <a class="card" href="https://www.xatakandroid.com/autor/alvaro-garcia">
      <img class="icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqoMNSiupnhdY1NZjORyh2jCctivdCoEI-7w&s">
      <div>
        <strong>Xataka Android</strong>
        <span>Android y apps</span>
      </div>
    </a>

  </div>

</div>

<script>
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('mousemove', e=>{
    const r = card.getBoundingClientRect();
    card.style.setProperty('--x', ((e.clientX-r.left)/r.width)*100 + '%');
    card.style.setProperty('--y', ((e.clientY-r.top)/r.height)*100 + '%');
  });
});
</script>

</body>
</html>
